name: build-zoekt-ctags-release

# Builds zoekt binaries (from VENDORED source) + universal-ctags (built natively
# per platform) and publishes a combined per-platform archive as a GitHub Release.
#
# zoekt is vendored at third_party/zoekt (NOT fetched from upstream) because it has
# no release tags and Windows support lives in an unmerged PR. See
# third_party/zoekt/VENDOR.md for the base commit + applied patch + update procedure.
#
# CTAGS_REF is pinned; bump deliberately (kept in sync with what zoekt tests against).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  # zoekt's own install-ctags-alpine.sh pins v6.1.0. Keep this aligned.
  CTAGS_REF: v6.1.0
  CTAGS_TARBALL_DIR: ctags-6.1.0

jobs:
  # ---------------------------------------------------------------------------
  # zoekt: pure-Go (CGO_ENABLED=0) -> cross-compile all 6 targets from a single
  # Linux runner, using the VENDORED source at third_party/zoekt (which carries
  # the Windows-support patch; see third_party/zoekt/VENDOR.md). Windows builds
  # only because of that vendored patch -- upstream alone does NOT compile for
  # GOOS=windows (index mmap + unix.Umask are Unix-only).
  # ---------------------------------------------------------------------------
  build-zoekt:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64,   goos: linux,   goarch: amd64 }
          - { target: linux-arm64,   goos: linux,   goarch: arm64 }
          - { target: macos-amd64,   goos: darwin,  goarch: amd64 }
          - { target: macos-arm64,   goos: darwin,  goarch: arm64 }
          - { target: windows-amd64, goos: windows, goarch: amd64, ext: ".exe" }
          - { target: windows-arm64, goos: windows, goarch: arm64, ext: ".exe" }
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repo (contains vendored zoekt)
        uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          # The Go module lives in the vendored subdir, not at repo root; point the
          # built-in module cache at its go.sum, else setup-go warns
          # "Dependencies file is not found ... Supported file pattern: go.sum".
          cache-dependency-path: third_party/zoekt/go.sum
      - name: Build zoekt binaries from vendored source
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eux
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cd third_party/zoekt
          for cmd in zoekt-webserver zoekt-git-index zoekt-index; do
            go build -trimpath -ldflags="-s -w" \
              -o "${GITHUB_WORKSPACE}/dist/${cmd}${{ matrix.ext }}" "./cmd/${cmd}"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: zoekt-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # universal-ctags on Linux: fully static (musl) so it runs on any distro.
  # The build runs inside Alpine via `docker run` -- NOT a job-level `container:`.
  # Why: a job-level Alpine container forces EVERY step (including the JS-based
  # actions/upload-artifact) to run in musl, and the runner only ships a musl
  # Node (node20_alpine) for x64. On ubuntu-24.04-arm that fails hard with
  # "JavaScript Actions in Alpine containers are only supported on x64 Linux
  # runners." Keeping Alpine at the STEP level means only the build is in musl;
  # upload-artifact runs on the host (glibc Node, available on both arches).
  # ---------------------------------------------------------------------------
  build-ctags-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Build + verify static universal-ctags in Alpine (musl)
        run: |
          set -eux
          # CTAGS_REF/CTAGS_TARBALL_DIR are expanded by the host shell into -e,
          # then re-expanded inside the container (single-quoted inner script).
          docker run --rm \
            -e CTAGS_REF="${CTAGS_REF}" \
            -e CTAGS_TARBALL_DIR="${CTAGS_TARBALL_DIR}" \
            -v "${GITHUB_WORKSPACE}:/work" -w /work \
            alpine:3.20 sh -eux -c '
              apk add --no-cache \
                autoconf automake binutils g++ gcc make \
                pkgconfig curl tar xz jansson-dev jansson-static
              curl -fL --retry 5 \
                "https://codeload.github.com/universal-ctags/ctags/tar.gz/${CTAGS_REF}" \
                | tar xz
              cd "${CTAGS_TARBALL_DIR}"
              ./autogen.sh
              # Only jansson dev/static is installed (no libyaml/pcre2/libxml2), so the
              # feature set stays minimal: +json +interactive -- matching every other
              # platform (parity). zoekt only needs json+interactive.
              LDFLAGS="-static" ./configure \
                --prefix=/work/out \
                --program-prefix=universal- --enable-json --disable-readcmd
              make -j"$(nproc)"
              make install
              strip /work/out/bin/universal-ctags
              # Verify jansson + interactive support in-place (still inside musl Alpine).
              /work/out/bin/universal-ctags --list-features | grep -wq json
              /work/out/bin/universal-ctags --list-features | grep -wq interactive
            '
      - uses: actions/upload-artifact@v6
        with:
          name: ctags-${{ matrix.target }}
          path: out/bin/universal-ctags
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # universal-ctags on macOS: minimal + self-contained, built on a SELF-HOSTED
  # Apple Silicon (arm64) Mac. One physical machine produces BOTH targets:
  #   - macos-arm64: native build (-arch arm64).
  #   - macos-amd64: cross-compiled (-arch x86_64) from the same arm64 host; the
  #     universal macOS SDK lets one clang emit x86_64. Verified at runtime via
  #     Rosetta 2 (installed once on this machine; idempotent thereafter).
  # We DON'T use GitHub-hosted macOS runners: macos-13 (Intel) was retired Dec 2025
  # (jobs hung at "Waiting for a runner..."), and bare macos-14/15 are arm64-only.
  # Design (unchanged from before): jansson built from source as a static lib
  # (controlled deployment floor); PKG_CONFIG_LIBDIR scoped to an empty dir so
  # libyaml/pcre2/libxml2 are NOT picked up -> +json +interactive only (parity),
  # leaving only system /usr/lib deps (self-contained). Binaries are signed +
  # notarized later in the `sign-macos` job (not here).
  #
  # Runner: register a self-hosted runner on your arm64 Mac advertising the labels
  # below. `ctags-mac` is a CUSTOM label -- change it to whatever your runner
  # actually advertises (e.g. reuse corral's `tauri-mac`). This workflow triggers
  # only on tag push / workflow_dispatch (never pull_request), so a self-hosted
  # runner is not exposed to fork-PR code execution.
  # ---------------------------------------------------------------------------
  build-ctags-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-amd64, arch: x86_64, min: "10.15" }   # Intel: cross-built on arm64
          - { target: macos-arm64, arch: arm64,  min: "11.0"  }   # Apple Silicon: native (arm64 min is 11.0)
    runs-on: [self-hosted, macOS, arm64, ctags-mac]
    steps:
      - name: Prepare clean workspace
        run: |
          set -eux
          # Self-hosted runners persist the workspace between runs; remove any
          # leftover build trees so curl|tar and ./configure start from scratch.
          rm -rf "${GITHUB_WORKSPACE}/jansson-2.15.0" \
                 "${GITHUB_WORKSPACE}/jansson-prefix" \
                 "${GITHUB_WORKSPACE}/${CTAGS_TARBALL_DIR}" \
                 "${GITHUB_WORKSPACE}/out"
      - name: Install build deps
        run: |
          set -eux
          # Guard on the COMMAND (pkgconf provides the pkg-config symlink), not the
          # brew keg name, so the pkg-config->pkgconf rename can't defeat the check
          # and we don't reinstall what the self-hosted machine already has.
          # autogen.sh just needs these tools present, whatever provides them.
          for c in autoconf automake pkg-config; do
            command -v "$c" >/dev/null 2>&1 || brew install "$c"
          done
      - name: Ensure Rosetta 2 (x86_64 runtime verification)
        if: matrix.arch == 'x86_64'
        run: |
          set -eux
          # Rosetta lets this arm64 host run the cross-built x86_64 ctags for the
          # --list-features check. On a persistent self-hosted machine it's normally
          # a ONE-TIME host setup; skip if the runtime marker is already present.
          if [ -f /Library/Apple/usr/share/rosetta/rosetta ] \
             || [ -f /Library/Apple/usr/libexec/oah/libRosettaRuntime ]; then
            echo "Rosetta 2 already installed"
            exit 0
          fi
          # Otherwise try to install it (may need elevation). If your runner user has
          # no passwordless sudo, install it once manually on the Mac instead:
          #   softwareupdate --install-rosetta --agree-to-license
          sudo softwareupdate --install-rosetta --agree-to-license \
            || softwareupdate --install-rosetta --agree-to-license
      - name: Build minimal self-contained universal-ctags
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.min }}
        run: |
          set -eux
          # Arch is set by `clang -arch`, NOT the autoconf triple, so -arch must be in
          # BOTH CFLAGS and LDFLAGS and identical for jansson and ctags (else the static
          # libjansson.a and the final link mismatch). For x86_64 we add --host to put
          # autotools in cross mode (skips run-tests it can't execute); the native arm64
          # cell needs no --host. config.guess supplies the build (arm64) triple.
          ARCHFLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=${{ matrix.min }}"
          CROSS=""
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            CROSS="--host=x86_64-apple-darwin"
          fi
          PFX="${GITHUB_WORKSPACE}/jansson-prefix"
          # 1) static jansson from source (controlled deployment floor)
          curl -fL --retry 5 \
            "https://github.com/akheron/jansson/releases/download/v2.15.0/jansson-2.15.0.tar.gz" \
            | tar xz
          ( cd jansson-2.15.0
            ./configure --prefix="$PFX" --enable-static --disable-shared \
              $CROSS CC=clang \
              CFLAGS="$ARCHFLAGS -O2" LDFLAGS="-arch ${{ matrix.arch }}"
            make -j"$(sysctl -n hw.ncpu)"
            make install )
          # 2) ctags: empty PKG_CONFIG_LIBDIR drops yaml/pcre2/xml2; jansson via explicit static override
          curl -fL --retry 5 \
            "https://codeload.github.com/universal-ctags/ctags/tar.gz/${CTAGS_REF}" \
            | tar xz
          cd "${CTAGS_TARBALL_DIR}"
          ./autogen.sh
          EMPTY="$(mktemp -d)"
          PKG_CONFIG_LIBDIR="$EMPTY" ./configure \
            --prefix="${GITHUB_WORKSPACE}/out" \
            --program-prefix=universal- --enable-json --disable-readcmd \
            $CROSS CC=clang \
            CFLAGS="$ARCHFLAGS -O2" LDFLAGS="-arch ${{ matrix.arch }}" \
            JANSSON_CFLAGS="-I${PFX}/include" \
            JANSSON_LIBS="${PFX}/lib/libjansson.a"
          make -j"$(sysctl -n hw.ncpu)"
          make install
          strip "${GITHUB_WORKSPACE}/out/bin/universal-ctags"
      - name: Verify (arch + json + interactive + self-contained)
        run: |
          set -eux
          B="${GITHUB_WORKSPACE}/out/bin/universal-ctags"
          # Build-time gate (both cells): correct arch + only system libs remain.
          lipo -archs "$B" | grep -wq "${{ matrix.arch }}"
          # fail if any non-system (Homebrew) or jansson dylib dependency remains
          ! otool -L "$B" | awk 'NR>1{print $1}' | grep -qE '^/opt/homebrew|^/usr/local|libjansson'
          # Runtime feature check: arm64 natively, x86_64 through Rosetta.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            "$B" --list-features | grep -wq json
            "$B" --list-features | grep -wq interactive
          else
            arch -x86_64 "$B" --list-features | grep -wq json
            arch -x86_64 "$B" --list-features | grep -wq interactive
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: ctags-${{ matrix.target }}
          path: out/bin/universal-ctags
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # universal-ctags on Windows via a SINGLE LLVM toolchain (llvm-mingw), cross-
  # compiled from Linux for BOTH arches. No Windows runners, no MSVC, no MSYS2.
  # Static + self-contained (json/interactive only; jansson+iconv statically
  # linked -> imports are system DLLs only). Verified locally for x86_64 & arm64.
  # Runtime (--list-features) can't run here (cross-build) -> verified on a real
  # Windows host or via Wine; +json is guaranteed by the --enable-json build.
  # ---------------------------------------------------------------------------
  build-ctags-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: windows-amd64, triple: x86_64-w64-mingw32 }
          - { target: windows-arm64, triple: aarch64-w64-mingw32 }
    runs-on: ubuntu-24.04
    container: mstorsjo/llvm-mingw:20260519
    steps:
      - name: Install build tools
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          # build-essential: native compiler for ctags' packcc build-tool. file: PE check.
          apt-get install -y -qq build-essential autoconf automake libtool make \
            pkg-config curl ca-certificates file xz-utils
      - name: Cross-build static universal-ctags
        run: |
          set -eux
          TRIPLE=${{ matrix.triple }}
          # libiconv (static) — Windows has no system iconv; ctags requires it.
          curl -fL --retry 5 https://ftp.gnu.org/gnu/libiconv/libiconv-1.17.tar.gz | tar xz
          ( cd libiconv-1.17 && ./configure --host="$TRIPLE" --prefix=/mw \
              --enable-static --disable-shared CC="$TRIPLE-clang" \
            && make -j"$(nproc)" && make install )
          # jansson (static)
          curl -fL --retry 5 https://github.com/akheron/jansson/releases/download/v2.15.0/jansson-2.15.0.tar.gz | tar xz
          ( cd jansson-2.15.0 && ./configure --host="$TRIPLE" --prefix=/mw \
              --enable-static --disable-shared CC="$TRIPLE-clang" \
            && make -j"$(nproc)" && make install )
          # ctags: empty PKG_CONFIG_LIBDIR drops yaml/pcre2/xml2 (parity); static link.
          curl -fL --retry 5 "https://codeload.github.com/universal-ctags/ctags/tar.gz/${CTAGS_REF}" | tar xz
          cd "${CTAGS_TARBALL_DIR}"
          ./autogen.sh
          EMPTY="$(mktemp -d)"
          PKG_CONFIG_LIBDIR="$EMPTY" ./configure --host="$TRIPLE" \
            --program-prefix=universal- --enable-json --disable-readcmd \
            CC="$TRIPLE-clang" CPPFLAGS="-I/mw/include" LDFLAGS="-static -L/mw/lib" \
            WINDRES="$TRIPLE-windres" RC="$TRIPLE-windres" \
            JANSSON_CFLAGS="-I/mw/include" JANSSON_LIBS="/mw/lib/libjansson.a"
          make -j"$(nproc)" WINDRES="$TRIPLE-windres"
          "$TRIPLE-strip" ctags.exe
          mkdir -p "${GITHUB_WORKSPACE}/out"
          cp ctags.exe "${GITHUB_WORKSPACE}/out/universal-ctags.exe"
      - name: Verify (PE + static self-contained)
        run: |
          set -eux
          TRIPLE=${{ matrix.triple }}
          B="${GITHUB_WORKSPACE}/out/universal-ctags.exe"
          file "$B"
          # fail if any non-system (jansson/iconv) DLL import remains -> not static
          ! "$TRIPLE-objdump" -p "$B" | grep -iE 'jansson|iconv'
      - uses: actions/upload-artifact@v6
        with:
          name: ctags-${{ matrix.target }}
          path: out/universal-ctags.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Sign + notarize the WHOLE macOS payload (zoekt + ctags) on the self-hosted
  # Mac. The zoekt binaries are cross-built on Linux and never touch a Mac, so
  # this is the only place they can get a Developer ID signature; ctags is built
  # on this same Mac. Per arch we pull the 4 macOS Mach-O binaries, codesign each
  # with Developer ID Application + hardened runtime + secure timestamp, then
  # notarize them in a single submission.
  #
  # NOTE: loose CLI executables cannot be `stapler staple`d (stapling only works
  # on .dmg/.pkg/.app). Notarization still succeeds -- the ticket is published to
  # Apple by cdhash and Gatekeeper validates online on first run -- so the bundle
  # stays a .tar.gz and the ticket is NOT embedded in the file.
  #
  # Requires repo (or org) secrets: MACOS_KEYCHAIN_PASSWORD (unlocks the signing
  # keychain), APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID. The keychain
  # Host prerequisite: the keychain ~/Library/Keychains/livteam-signing.keychain-db
  # (holding the Developer ID identity) must already exist on the runner Mac, and
  # MACOS_KEYCHAIN_PASSWORD must equal its password. Unlock + search-list + key
  # partition-list are all handled in-job (below), so no other host setup is needed.
  # We sign by SHA-1 fingerprint, NOT the cert name, because multiple
  # "Developer ID Application: buyong lee" certs exist on this Mac -> signing by
  # name would be ambiguous.
  # ---------------------------------------------------------------------------
  sign-macos:
    needs: [build-zoekt, build-ctags-macos]
    runs-on: [self-hosted, macOS, arm64, ctags-mac]
    strategy:
      fail-fast: false
      matrix:
        target: [macos-amd64, macos-arm64]
    steps:
      - name: Prepare clean workspace
        run: |
          set -eux
          rm -rf "${GITHUB_WORKSPACE}/sign"
          mkdir -p "${GITHUB_WORKSPACE}/sign"
      # Pull this arch's zoekt (3 bins) + ctags (1 bin) into one flat dir to sign.
      - uses: actions/download-artifact@v7
        with:
          name: zoekt-${{ matrix.target }}
          path: sign
      - uses: actions/download-artifact@v7
        with:
          name: ctags-${{ matrix.target }}
          path: sign
      - name: Unlock signing keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -eux
          KEYCHAIN_PATH="$HOME/Library/Keychains/livteam-signing.keychain-db"
          if [ ! -f "$KEYCHAIN_PATH" ]; then
            echo "Signing keychain not found at $KEYCHAIN_PATH" >&2
            exit 1
          fi
          # codesign only searches the user keychain search list. A runner started as
          # a launchd service may begin with a reduced list, so add our keychain if
          # missing. Idempotent + non-destructive (no-op when already present), so no
          # restore step is needed -- it's the user's own keychain. Build the new list
          # in an array (quote-safe: paths with spaces won't word-split).
          if ! security list-keychains -d user | grep -Fq "livteam-signing.keychain-db"; then
            existing=()
            while IFS= read -r line; do
              kc="${line#*\"}"; kc="${kc%\"*}"   # strip the surrounding quotes
              [ -n "$kc" ] && existing+=("$kc")
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "$KEYCHAIN_PATH" "${existing[@]}"
          fi
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          # Grant codesign non-interactive access to the private key. WITHOUT this a
          # headless launchd runner fails with errSecInternalComponent / "User
          # interaction is not allowed" (it never shows a GUI prompt). Idempotent.
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
      - name: Codesign (Developer ID + hardened runtime)
        env:
          # Sign by SHA-1 fingerprint, NOT the friendly name: several
          # "Developer ID Application: buyong lee (QTQPM83KWL)" certs exist on this
          # Mac, so the name is ambiguous and `codesign --sign <name>` would fail.
          # This hash = the identity in livteam-signing.keychain-db. Not secret;
          # change it (security find-identity -v -p codesigning <keychain>) if the
          # cert is rotated.
          SIGNING_IDENTITY: "29288FE3B51E827A802682ED015D555EC037B19E"
        run: |
          set -eux
          cd "${GITHUB_WORKSPACE}/sign"
          for b in *; do
            [ -f "$b" ] || continue
            # --timestamp (secure timestamp) + --options runtime (hardened runtime)
            # are both REQUIRED for notarization. strip already ran in the build job;
            # signing must be the last mutation or it invalidates the signature.
            codesign --force --timestamp --options runtime \
              --sign "$SIGNING_IDENTITY" "$b"
            codesign --verify --strict --verbose=2 "$b"
          done
      - name: Notarize (single submission for all binaries of this arch)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eux
          # notarytool needs a container; zip all signed binaries and submit once.
          ZIP="${RUNNER_TEMP}/${{ matrix.target }}-notarize.zip"
          rm -f "$ZIP"
          ditto -c -k "${GITHUB_WORKSPACE}/sign" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          # No `stapler staple`: loose executables aren't a staple-able container.
      - uses: actions/upload-artifact@v6
        with:
          # Combined, signed+notarized macOS payload (zoekt + ctags) for this arch.
          # package-and-release consumes THIS instead of the unsigned zoekt-/ctags-*.
          name: signed-${{ matrix.target }}
          path: sign/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Bundle zoekt + ctags per platform and publish. `if: always()` is defensive:
  # if any single cell fails, still release the cells that succeeded.
  # macOS uses the signed+notarized payload (signed-macos-*); linux/windows use
  # the plain zoekt-/ctags-* artifacts.
  # ---------------------------------------------------------------------------
  package-and-release:
    needs: [build-zoekt, build-ctags-linux, build-ctags-windows, sign-macos]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Repo checkout is needed so we can read CHANGELOG.md (authored by codex,
      # reviewed before the tag was pushed) and inject it into the release body.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Assemble per-platform archives
        run: |
          set -eux
          mkdir -p out
          for t in linux-amd64 linux-arm64 macos-amd64 macos-arm64 windows-amd64 windows-arm64; do
            case "$t" in
              macos-*)
                # signed-macos-* already bundles BOTH zoekt + ctags (signed+notarized).
                s="artifacts/signed-${t}"
                if [ -d "$s" ]; then
                  stage="stage/${t}"; mkdir -p "$stage"
                  cp "$s"/* "$stage"/
                  chmod +x "$stage"/* || true
                  tar -czf "out/zoekt-ctags-${t}.tar.gz" -C stage "$t"
                else
                  echo "::warning::skip ${t} (signed-macos MISSING)"
                fi
                ;;
              *)
                z="artifacts/zoekt-${t}"
                c="artifacts/ctags-${t}"
                if [ -d "$z" ] && [ -d "$c" ]; then
                  stage="stage/${t}"; mkdir -p "$stage"
                  cp "$z"/* "$stage"/
                  cp "$c"/* "$stage"/
                  chmod +x "$stage"/* || true
                  case "$t" in
                    windows-*) (cd stage && zip -r "../out/zoekt-ctags-${t}.zip" "$t") ;;
                    *)         tar -czf "out/zoekt-ctags-${t}.tar.gz" -C stage "$t" ;;
                  esac
                else
                  echo "::warning::skip ${t} (zoekt=$([ -d "$z" ] && echo ok || echo MISSING), ctags=$([ -d "$c" ] && echo ok || echo MISSING))"
                fi
                ;;
            esac
          done
          ls -l out
      # universal-ctags is GPL-2.0-or-later and statically links LGPL-2.1+ libiconv (Windows).
      # GPLv2 section 3 / LGPL require shipping the corresponding source with the binaries.
      # Attach the exact, unmodified upstream source tarballs we build from. See THIRD_PARTY_NOTICES.md.
      - name: Fetch corresponding source (GPL/LGPL compliance)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eux
          curl -fL --retry 5 -o "out/SOURCE-ctags-${CTAGS_REF}.tar.gz" \
            "https://codeload.github.com/universal-ctags/ctags/tar.gz/${CTAGS_REF}"
          curl -fL --retry 5 -o "out/SOURCE-libiconv-1.17.tar.gz" \
            "https://ftp.gnu.org/gnu/libiconv/libiconv-1.17.tar.gz"
          curl -fL --retry 5 -o "out/SOURCE-jansson-2.15.0.tar.gz" \
            "https://github.com/akheron/jansson/releases/download/v2.15.0/jansson-2.15.0.tar.gz"
      # SHA-256 integrity. For EVERY published file we emit a sibling
      # <name>.sha256 in sha256sum format (so `sha256sum -c <name>.sha256` works),
      # plus a single SHA256SUMS manifest listing them all (DX: one file to verify
      # any download; the MCP server pins these same values).
      # Hash target = the published files themselves -- the per-platform archive a
      # consumer downloads (.tar.gz/.zip) and the GPL SOURCE-*.tar.gz. tar/gzip embed
      # mtimes, so hashes are per-release-artifact, NOT reproducible across rebuilds.
      # Verify a single download with: sha256sum --ignore-missing -c SHA256SUMS
      - name: Generate SHA-256 checksums
        run: |
          set -eux
          cd out
          rm -f SHA256SUMS ./*.sha256
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in SHA256SUMS|*.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
          # Combined manifest = the per-file lines, sorted by name (no re-hash).
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      # Build the release body = CHANGELOG.md section for THIS tag (authored by codex)
      # PREPENDED to the static build/integrity/licensing notes. release-it does NOT
      # create the release; CI is the single creator and owns the body. Written outside
      # out/ so it is not uploaded as an asset (files: out/* / SHA256SUMS exclude it).
      - name: Assemble release notes (changelog + static notes)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          # Extract the "## [X.Y.Z]" section, up to (not incl.) the next "## [" heading.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > changelog-section.md || true
          BODY="${GITHUB_WORKSPACE}/RELEASE_BODY.md"
          {
            echo "## Changelog"
            echo
            if [ -s changelog-section.md ]; then
              cat changelog-section.md
            else
              echo "_(CHANGELOG.md에 v${version} 항목이 없습니다)_"
            fi
            echo
            echo "---"
            echo
          } > "$BODY"
          # Quoted heredoc -> no shell expansion (backticks stay literal); the one
          # version token is substituted via sed from the workflow env CTAGS_REF.
          cat <<'NOTES' | sed "s/@CTAGS_REF@/${CTAGS_REF}/g" >> "$BODY"
          zoekt: vendored (see third_party/zoekt/VENDOR.md) + universal-ctags `@CTAGS_REF@`

          ctags: minimal feature set (+json +interactive), self-contained, stripped.
          zoekt: all targets Go-cross-built on Linux. ctags: Linux + Windows cross-built on
          Linux (Windows via one llvm-mingw toolchain, no Windows runners); macOS ctags still
          built on macOS runners (no Linux->macOS cross here).
          Runtime-verified: linux-amd64/arm64, macos-amd64/arm64 (+ macos x86_64 via Rosetta).
          Build-verified only (runtime not yet tested on real hardware): windows-amd64, windows-arm64.

          Integrity: every asset has a sibling `<name>.sha256`, and `SHA256SUMS` lists them all.
          Verify a single download with: `sha256sum --ignore-missing -c SHA256SUMS`

          Licensing: this project is Apache-2.0; bundled universal-ctags is GPL-2.0-or-later
          (with LGPL-2.1+ libiconv statically linked on Windows). Corresponding source is attached
          as SOURCE-*.tar.gz. See THIRD_PARTY_NOTICES.md.
          NOTES
          echo "----- RELEASE_BODY.md -----"
          cat "$BODY"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*
          body_path: ${{ github.workspace }}/RELEASE_BODY.md
      - uses: actions/upload-artifact@v6
        with:
          name: release-bundles
          path: out/
